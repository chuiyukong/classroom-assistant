xt x="175" y="309" text-anchor="middle" font-size="15" fill="#647d88">局域网 · 无需安装</text><rect x="360" y="170" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="490" y="202" text-anchor="middle" font-size="20" fill="#365d61">教师机应用</text><text x="490" y="229" text-anchor="middle" font-size="15" fill="#647d88">Flask / Waitress</text><rect x="680" y="70" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="810" y="102" text-anchor="middle" font-size="20" fill="#365d61">班级与学生</text><text x="810" y="129" text-anchor="middle" font-size="15" fill="#647d88">届数、学期、职务、私密备注</text><rect x="680" y="210" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="810" y="242" text-anchor="middle" font-size="20" fill="#365d61">统一座位业务接口</text><text x="810" y="269" text-anchor="middle" font-size="15" fill="#647d88">当前座位、存档、设备配置</text><rect x="680" y="350" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="810" y="382" text-anchor="middle" font-size="20" fill="#365d61">每节课堂与考勤</text><text x="810" y="409" text-anchor="middle" font-size="15" fill="#647d88">上下课、签到、换座审批</text><rect x="1030" y="70" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="1160" y="102" text-anchor="middle" font-size="20" fill="#365d61">SQLite 数据库</text><text x="1160" y="129" text-anchor="middle" font-size="15" fill="#647d88">各模块保存自己的记录</text><rect x="1030" y="210" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="1160" y="242" text-anchor="middle" font-size="20" fill="#365d61">随机点名</text><text x="1160" y="269" text-anchor="middle" font-size="15" fill="#647d88">范围、动画、学生端通知</text><rect x="1030" y="350" width="260" height="80" rx="12" fill="white" stroke="#b9d2d3"/><text x="1160" y="382" text-anchor="middle" font-size="20" fill="#365d61">班级数据与导出</text><text x="1160" y="409" text-anchor="middle" font-size="15" fill="#647d88">课堂日志、CSV、原模板 Excel</text><text x="45" y="492" font-size="18" fill="#365d61">单程序 · 单数据库 · 模块各自维护数据 · 学生端资源全部本地提供</text><text x="45" y="527" font-size="16" fill="#647d88">后续教学模块通过 lesson_id + student_id 关联课堂；不通过 Excel 交换数据。</text></g></svg>