<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1070" viewBox="0 0 1560 1070"><rect width="1560" height="1070" fill="#edf2f5"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="60" y="65" font-size="36" font-weight="bold" fill="#193e40">智慧课堂综合平台 · 全功能流程图</text><text x="60" y="104" font-size="21" fill="#536775">v1.6.0 · 教师机运行，学生浏览器访问 · 固定座位长期复用，每节课堂独立记录</text><rect x="40" y="140" width="1480" height="187" rx="16" fill="white"/><text x="60" y="175" font-size="23" font-weight="bold" fill="#145e51">01 · 学期准备</text><rect x="65" y="192" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="83" y="223" font-size="23" font-weight="bold" fill="#145e51">班级与学期</text><text x="83" y="255" font-size="20" fill="#263a47">新建 / 选择当前班</text><text x="83" y="284" font-size="19" fill="#536775">年级、年份、上 / 下学期独立保存</text><text x="521" y="255" font-size="26" fill="#145e51">→</text><rect x="555" y="192" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="573" y="223" font-size="23" font-weight="bold" fill="#145e51">设备配置</text><text x="573" y="255" font-size="20" fill="#263a47">停用故障座位 / 设备备注</text><text x="573" y="284" font-size="19" fill="#536775">物理设备跨班级共用</text><text x="1011" y="255" font-size="26" fill="#145e51">→</text><rect x="1045" y="192" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="1063" y="223" font-size="23" font-weight="bold" fill="#145e51">首次在线选座</text><text x="1063" y="255" font-size="20" fill="#263a47">开放 → 填姓名 → 结束 → 导出</text><text x="1063" y="284" font-size="19" fill="#536775">同座冲突、IP 限制、同名教师处理</text><rect x="40" y="345" width="1480" height="187" rx="16" fill="white"/><text x="60" y="380" font-size="23" font-weight="bold" fill="#205976">02 · 每节课堂</text><rect x="65" y="397" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="83" y="428" font-size="23" font-weight="bold" fill="#205976">开始上课</text><text x="83" y="460" font-size="20" fill="#263a47">考勤保存独立名单快照</text><text x="83" y="489" font-size="19" fill="#536775">仅在考勤页开始上课</text><text x="521" y="460" font-size="26" fill="#205976">→</text><rect x="555" y="397" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="573" y="428" font-size="23" font-weight="bold" fill="#205976">按需发起签到</text><text x="573" y="460" font-size="20" fill="#263a47">倒计时内：正常到场</text><text x="573" y="489" font-size="19" fill="#536775">点击原位 / 空座，输入登记姓名</text><text x="1011" y="460" font-size="26" fill="#205976">→</text><rect x="1045" y="397" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="1063" y="428" font-size="23" font-weight="bold" fill="#205976">到时仍可签到</text><text x="1063" y="460" font-size="20" fill="#263a47">未签到：剩余时间 → 签到超时</text><text x="1063" y="489" font-size="19" fill="#536775">截止时刻起：自动迟到</text><rect x="40" y="550" width="1480" height="187" rx="16" fill="white"/><text x="60" y="585" font-size="23" font-weight="bold" fill="#865220">03 · 教师处理</text><rect x="65" y="602" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="83" y="633" font-size="23" font-weight="bold" fill="#865220">结束签到</text><text x="83" y="665" font-size="20" fill="#263a47">学生停止提交，未到记缺勤</text><text x="83" y="694" font-size="19" fill="#536775">教师可补签 / 指定学生换机重签</text><text x="521" y="665" font-size="26" fill="#865220">→</text><rect x="555" y="602" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="573" y="633" font-size="23" font-weight="bold" fill="#865220">换座与备注</text><text x="573" y="665" font-size="20" fill="#263a47">临时 / 长期换座均提交申请</text><text x="573" y="694" font-size="19" fill="#536775">长期申请审核通过才改固定座位</text><text x="1011" y="665" font-size="26" fill="#865220">→</text><rect x="1045" y="602" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="1063" y="633" font-size="23" font-weight="bold" fill="#865220">随机点名</text><text x="1063" y="665" font-size="20" fill="#263a47">无签到用座位，有签到用到场名单</text><text x="1063" y="694" font-size="19" fill="#536775">全部 / 迟到 / 手动范围，结果不保存</text><rect x="40" y="755" width="1480" height="187" rx="16" fill="white"/><text x="60" y="790" font-size="23" font-weight="bold" fill="#514878">04 · 课后与维护</text><rect x="65" y="807" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="83" y="838" font-size="23" font-weight="bold" fill="#514878">下课</text><text x="83" y="870" font-size="20" fill="#263a47">审批和纠错先完成，再结束</text><text x="83" y="899" font-size="19" fill="#536775">课堂日志只读 / 下节新建快照</text><text x="521" y="870" font-size="26" fill="#514878">→</text><rect x="555" y="807" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="573" y="838" font-size="23" font-weight="bold" fill="#514878">查询与导出</text><text x="573" y="870" font-size="20" fill="#263a47">班级数据管理：年级 / 班级 / 日期</text><text x="573" y="899" font-size="19" fill="#536775">座位日志 / 签到时间 / IP / CSV</text><text x="1011" y="870" font-size="26" fill="#514878">→</text><rect x="1045" y="807" width="450" height="112" rx="10" fill="#f1f5f7"/><text x="1063" y="838" font-size="23" font-weight="bold" fill="#514878">学期管理与数据</text><text x="1063" y="870" font-size="20" fill="#263a47">筛选 / 批量回收站 / 恢复</text><text x="1063" y="899" font-size="19" fill="#536775">本地 SQLite、升级备份、历史保留</text><text x="60" y="1000" font-size="21" fill="#193e40">私密边界：学生备注与设备问题仅教师可见；IP 是设备线索，不是学生身份。</text><text x="60" y="1037" font-size="20" fill="#536775">尚未实现：AI 对话采集、噪声检测、互动游戏等。详细规则与验收步骤见项目功能说明和测试指南。</text></g></svg>